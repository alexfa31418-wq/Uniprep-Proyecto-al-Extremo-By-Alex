<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPrep</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .progress {
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #2563eb;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>UniPrep</h1>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>¡Bienvenido a UniPrep! 👋</h2>
            <p>Continúa preparándote para tu examen.</p>

            <a href="#" class="button">
                Continuar estudiando
            </a>
        </section>

        <section class="subjects">

            <div class="card">
                <h3>📐 Matemática</h3>
                <p>45% completado</p>

                <div class="progress">
                    <div class="progress-bar" style="width:45%"></div>
                </div>
            </div>

            <div class="card">
                <h3>📖 Lengua</h3>
                <p>60% completado</p>

                <div class="progress">
                    <div class="progress-bar" style="width:60%"></div>
                </div>
            </div>

            <div class="card">
                <h3>🔷 Abstracto</h3>
                <p>25% completado</p>

                <div class="progress">
                    <div class="progress-bar" style="width:25%"></div>
                </div>
            </div>

            <div class="card">
                <h3>🧠 Lógico</h3>
                <p>35% completado</p>

                <div class="progress">
                    <div class="progress-bar" style="width:35%"></div>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
